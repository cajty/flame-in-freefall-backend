[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flame-atlas-backend"
version = "0.1.0"
description = "Read-only data tools and analysis agent for the Flame Atlas dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "pydantic-ai>=2.51,<3",
  "logfire>=5.6,<6",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/agents",
  "src/api",
  "src/config",
  "src/core",
  "src/models",
  "src/prompts",
  "src/tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
